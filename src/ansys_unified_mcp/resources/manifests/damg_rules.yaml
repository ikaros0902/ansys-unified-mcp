# ------------------------------------------------------------------------------
# 3. Multiphysics Coupling Bridges (Cross-Discipline Inter-Dependencies)
# ------------------------------------------------------------------------------
couplings:
  thermal_stress:
    name: "Thermal-Stress Coupling"
    source_node: "TEMPERATURE_DISTRIBUTION_EXTRACTED"
    target_node: "STRUCTURAL_SOLVER_CONFIGURED"
    description: "Thermal field maps to structural finite element model as body temperature load."

  aerodynamic_fluid_structure_interaction:
    name: "Aero-Structural FSI Coupling"
    source_node: "FLOW_FIELD_RESULTS_EXTRACTED"
    target_node: "STRUCTURAL_BOUNDARIES_APPLIED"
    description: "Fluid boundary surface pressure fields map to structural face pressure loads."

  joule_heating_electro_thermal:
    name: "Joule Heating Electro-Thermal Coupling"
    source_node: "MAGNETIC_FLUX_TORQUE_EXTRACTED"
    target_node: "THERMAL_LOADS_BC_APPLIED"
    description: "Electromagnetic ohmic and eddy loss densities map to thermal heat generation loads."

  dielectric_heating_hf_thermal:
    name: "Dielectric Loss HFSS-Thermal Coupling"
    source_node: "S_PARAMETERS_RADIATION_EXTRACTED"
    target_node: "THERMAL_LOADS_BC_APPLIED"
    description: "RF dielectric volume loss densities map to thermal dissipation loads."

# ------------------------------------------------------------------------------
# 4. Dirty Invalidation Cascades Policy
# ------------------------------------------------------------------------------
dirty_invalidation_cascades:
  upstream_triggers:
    geometry_change:
      description: "Modifications to CAD geometry, dimensioning, or defeaturing"
      target_levels: [1, 2, 3, 4, 5, 6, 7]
      cascaded_status: "DIRTY"
      policy: "Invalidate mesh, boundary associations, setup parameters, and all solver solutions."

    material_change:
      description: "Modifications to material properties, constitutive equations, or assignments"
      target_levels: [2, 5, 6, 7]
      cascaded_status: "DIRTY"
      policy: "Preserve geometry and surface mesh; invalidate physics setup, solver execution, and observables."

    boundary_condition_change:
      description: "Modifications to loads, constraints, inlet velocities, or excitation ports"
      target_levels: [3, 5, 6, 7]
      cascaded_status: "DIRTY"
      policy: "Preserve geometry, materials, and mesh discretization; invalidate solver iterations and observables."

    mesh_discretization_change:
      description: "Modifications to element sizing, boundary layer inflations, or refinement zones"
      target_levels: [4, 5, 6, 7]
      cascaded_status: "DIRTY"
      policy: "Preserve geometry and material assignment; invalidate solver execution and observables."
